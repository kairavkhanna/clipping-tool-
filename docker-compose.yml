services:
  clipper:
    build: .
    restart: unless-stopped
    environment:
      CLIPPER_USER: ${CLIPPER_USER:-clipper}
      CLIPPER_PASSWORD: ${CLIPPER_PASSWORD:?Set CLIPPER_PASSWORD in the .env file}
      ALLOWED_HOSTS: ${DOMAIN:?Set DOMAIN in the .env file}
      RETENTION_HOURS: ${RETENTION_HOURS:-48}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      CLIPPER_WHISPER_MODEL: ${CLIPPER_WHISPER_MODEL:-small}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      YT_COOKIES: /run/cookies.txt
    volumes:
      - clipper-data:/data
      # Optional: uncomment after you create cookies.txt (see DEPLOY.md, "If YouTube blocks the server")
      # - ./cookies.txt:/run/cookies.txt:ro

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - clipper

volumes:
  clipper-data:
  caddy-data:
  caddy-config:
